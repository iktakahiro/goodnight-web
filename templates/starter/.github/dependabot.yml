# Dependabot opens pull requests that update the packages of this site.
#
# - goodnight-web updates (@goodnight-web/*) come in one pull request.
# - The cooldown waits until a version has been public for 5 days. Security
#   updates are not delayed.
# - Merge only pull requests that have the "official goodnight-web update"
#   comment from the Update check workflow. See README.md.
# - TypeScript major updates are ignored for now. See the comment on the
#   "ignore" list below.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      goodnight-web:
        patterns: ['@goodnight-web/*']
      site-dependencies:
        patterns: ['*']
        exclude-patterns: ['@goodnight-web/*']
        update-types: [minor, patch]
    # Temporary: this site stays on TypeScript 6 because "astro check"
    # (@astrojs/check) needs the TypeScript 6 compiler API. Remove this rule
    # once Astro's tooling supports TypeScript 7.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
