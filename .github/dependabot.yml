# Dependabot for the development repository. The cooldown matches the 48-hour
# release-age gate in bunfig.toml. It applies to version updates only; security
# updates are not delayed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    # Dependabot puts an update in the first group that matches, so this
    # group must stay above minor-and-patch.
    groups:
      # apps/docs pins lucide-react, and fumadocs-ui depends on lucide-react
      # (^1.50.0), which fumadocs-core also takes as a peer. If they move in
      # separate PRs, fumadocs-ui can keep a nested lucide-react of another
      # version. The isolated linker then installs two fumadocs-core
      # instances, and apps/docs fails to type-check with a TranslationsAPI
      # error in src/routes/__root.tsx (#9, fixed in #20). Two instances
      # would also split the fumadocs-core React contexts at runtime.
      # Update them together so the lockfile keeps one of each.
      fumadocs:
        patterns: ['fumadocs-*', 'lucide-react']
      # packages/server lists the exact peer dependencies of
      # @better-auth/passkey (better-auth, @better-auth/core, better-call,
      # @better-fetch/fetch) as dependencies, so that `npm install` of the
      # published package resolves without ERESOLVE (docs/starter.md). They
      # must move together, or the tree gets two versions of better-call.
      better-auth:
        patterns:
          - 'better-auth'
          - '@better-auth/*'
          - 'auth'
          - 'better-call'
          - '@better-fetch/*'
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
