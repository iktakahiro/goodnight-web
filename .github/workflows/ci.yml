name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format
      - name: Type check
        run: bun run type-check
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build

      # Deploy check: runs `turbo run deploy:check`, which runs
      # `wrangler deploy --dry-run` in each workspace that defines the script:
      # templates/starter (the site Worker with @goodnight-web/server, its
      # bindings, and the built pages), apps/docs, and packages/server (its
      # e2e Worker). It never deploys and needs no Cloudflare account.
      - name: Deploy check (wrangler dry run)
        run: bun run deploy:check
