name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format
      - name: Type check
        run: bun run type-check
      - name: SQL guard (no sql.raw or direct D1 statements)
        run: bun run check:sql
      - name: Migrations match the Drizzle schema
        run: bun run db:check
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      # The server package can be packed and the starter pins its exact
      # version, so the Deploy to Cloudflare button (which copies
      # templates/starter alone) installs it from npm. Needs the build.
      - name: Release check (package contents, starter pin and lockfile)
        run: bun run check:release
      # Workers Builds installs a copied starter with `npm ci` (npm 10.9.2)
      # from templates/starter/package-lock.json. Check that npm accepts the
      # lockfile as it is, outside the workspace, without running scripts.
      - name: Starter lockfile (npm ci dry run)
        run: |
          scratch="$(mktemp -d)"
          cp templates/starter/package.json templates/starter/package-lock.json "$scratch/"
          cd "$scratch"
          npx -y npm@10.9.2 ci --dry-run --ignore-scripts

      # Deploy check: runs `turbo run deploy:check`, which runs
      # `wrangler deploy --dry-run` in each workspace that defines the script:
      # templates/starter (the site Worker with @goodnight-web/server, its
      # bindings, and the built pages), apps/docs, and packages/server (its
      # e2e Worker). It never deploys and needs no Cloudflare account.
      - name: Deploy check (wrangler dry run)
        run: bun run deploy:check

  # End-to-end tests: `wrangler dev` with local D1 and Playwright Chromium.
  # packages/server stubs Turnstile; templates/starter uses Cloudflare's
  # public Turnstile test keys and needs network access to
  # challenges.cloudflare.com. No Cloudflare account is used.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # The starter's e2e test runs on Node (`node e2e/run.ts`), which needs
      # built-in TypeScript type stripping.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: bun install --frozen-lockfile
      - name: Playwright version
        id: playwright
        working-directory: packages/server
        run: echo "version=$(node_modules/.bin/playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright Chromium
        working-directory: packages/server
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Build
        run: bun run build
      - name: Server e2e
        working-directory: packages/server
        env:
          E2E_DEBUG_DIR: ${{ github.workspace }}/e2e-artifacts/server
        run: bun run test:e2e
      - name: Starter e2e
        if: ${{ !cancelled() }}
        working-directory: templates/starter
        env:
          E2E_DEBUG_DIR: ${{ github.workspace }}/e2e-artifacts/starter
        run: bun run test:e2e
      - name: Upload screenshots and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7
