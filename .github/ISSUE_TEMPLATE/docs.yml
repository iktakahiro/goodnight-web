name: Documentation
description: A page is wrong, unclear, or missing.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL or the file path.
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Japanese
        - Both
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or unclear
      description: What you were trying to do and where the page did not help.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Optional. A sentence or two is enough.
